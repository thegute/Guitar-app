name: Build KGuitar for Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare the Android SDK
        run: |
          echo "Android SDK at $ANDROID_HOME"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Build the web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk KGuitar-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KGuitar-apk
          path: KGuitar-*.apk

      - name: Publish a download page (GitHub release)
        # test builds on other branches only check that everything compiles
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "KGuitar-${{ github.run_number }}.apk" \
            --title "KGuitar build ${{ github.run_number }}" \
            --notes "On your phone: open this page, tap KGuitar-${{ github.run_number }}.apk, then Install. Each new build installs over the old one and keeps your settings." \
            --latest

      - name: Publish a test build page (big-update, before "ship it")
        if: github.ref == 'refs/heads/big-update'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${{ github.run_number }}" "KGuitar-${{ github.run_number }}.apk" \
            --target big-update --prerelease \
            --title "KGuitar TEST build ${{ github.run_number }} (big update, not final)" \
            --notes "Test build of the big update, for trying before it ships. On your phone: open this page, tap KGuitar-${{ github.run_number }}.apk, then Install. It installs over your current KGuitar and keeps your songs and settings."
